# ST-Link SWD connection for STM32F407, without connect-under-reset.
source [find interface/stlink.cfg]
transport select swd
source [find target/stm32f4x.cfg]
adapter speed 400

# The stock target script changes adapter speed during resets.
$_TARGETNAME configure -event reset-start { adapter speed 400 }
# Preserve its clock setup, then restore the requested adapter speed.
set _board_reset_init [$_TARGETNAME cget -event reset-init]
append _board_reset_init "\nadapter speed 400"
$_TARGETNAME configure -event reset-init $_board_reset_init
unset _board_reset_init
