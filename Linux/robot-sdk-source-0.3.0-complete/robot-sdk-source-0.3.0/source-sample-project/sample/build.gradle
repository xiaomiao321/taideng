plugins { id 'com.android.application' }

android {
    namespace 'com.example.rk3566hardwarevalidator.sdksample'
    compileSdk 37
    lint { disable 'ExpiredTargetSdkVersion' }
    defaultConfig {
        applicationId 'com.example.rk3566hardwarevalidator.sdksourcesample'
        minSdk 29
        targetSdk 30
        versionCode 3
        versionName '0.3.0'
        buildConfigField 'String', 'INTEGRATION_MODE', '"SDK 可编辑源码接入"'
        ndk { abiFilters 'arm64-v8a' }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    buildFeatures { buildConfig true }
}

dependencies {
    implementation project(':robot-sdk')
    implementation files('../robot-sdk/libs/sherpa-onnx-v1.13.6-arm64-rknn-no-runtime.aar')
    implementation 'androidx.core:core-ktx:1.10.1'
    implementation 'com.github.mik3y:usb-serial-for-android:3.11.0'
}
