plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.rk3566hardwarevalidator.sdksample'
    compileSdk 37
    // Board-only Android 11 demo, not distributed through Google Play.
    lint { disable 'ExpiredTargetSdkVersion' }
    defaultConfig {
        applicationId 'com.example.rk3566hardwarevalidator.sdksample'
        minSdk 29
        targetSdk 30
        versionCode 3
        versionName '0.3.0'
        buildConfigField 'String', 'INTEGRATION_MODE', '"AAR 二进制接入"'
        ndk { abiFilters 'arm64-v8a' }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    buildFeatures { buildConfig true }
}

dependencies {
    implementation files('../libs/robot-sdk-0.3.0.aar')
    implementation files('../libs/sherpa-onnx-v1.13.6-arm64-rknn-no-runtime.aar')
    implementation 'com.github.mik3y:usb-serial-for-android:3.11.0'
    implementation 'androidx.core:core-ktx:1.10.1'
}
